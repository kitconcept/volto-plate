name: Deploy to staging after tag creation

on:
  push:
    tags:
      - '*'

jobs:

  config:
    uses: ./.github/workflows/config.yml
    with:
      environment: "plate.kitconcept.io"

  release-backend:
    name: "Backend: Build and publish Container Image"
    uses: plone/meta/.github/workflows/container-image-build-push.yml@2.x
    needs:
      - config
    permissions:
      contents: read
      packages: write
    with:
      base-tag: ${{ github.ref_name }}
      image-name-prefix: ${{ needs.config.outputs.image-name-prefix }}
      image-name-suffix: backend
      working-directory: backend
      build-args: |
        PLONE_VERSION=${{ needs.config.outputs.plone-version }}
        PYTHON_VERSION=${{ needs.config.outputs.python-version }}
      push: true
    secrets:
      username: ${{ github.actor }}
      password: ${{ secrets.GITHUB_TOKEN }}

  release-demo:
    name: "Backend: Build and publish Container Image for Demo"
    uses: plone/meta/.github/workflows/container-image-build-push.yml@2.x
    needs:
      - config
      - release-backend
    permissions:
      contents: read
      packages: write
    with:
      base-tag: ${{ github.ref_name }}
      image-name-prefix: ${{ needs.config.outputs.image-name-prefix }}
      image-name-suffix: demo
      working-directory: backend
      dockerfile: Dockerfile.demo
      build-args: |
        BASE_IMAGE=${{ needs.config.outputs.image-name-prefix }}-backend
        BASE_TAG=${{ github.ref_name }}
      push: true
    secrets:
      username: ${{ github.actor }}
      password: ${{ secrets.GITHUB_TOKEN }}

  release-frontend:
    name: "Frontend: Build and publish container image"
    uses: plone/meta/.github/workflows/container-image-build-push.yml@2.x
    needs:
      - config
    permissions:
      contents: read
      packages: write
    with:
      base-tag: ${{ github.ref_name }}
      image-name-prefix: ${{ needs.config.outputs.image-name-prefix }}
      image-name-suffix: frontend
      working-directory: frontend
      build-args: |
        VOLTO_VERSION=${{ needs.config.outputs.volto-version }}
      push: true
    secrets:
      username: ${{ github.actor }}
      password: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    runs-on: ubuntu-latest
    needs:
      - config
      - release-backend
      - release-demo
      - release-frontend
    environment: ${{ needs.config.outputs.environment }}
    outputs:
      environment: ${{ steps.vars.outputs.environment }}
      hostname: ${{ steps.vars.outputs.hostname }}
      hash: ${{ steps.vars.outputs.hash }}
      image-tag: ${{ steps.vars.outputs.image-tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Annotate deployment
        id: vars
        shell: bash
        run: |
          echo "environment=${{ needs.config.outputs.environment }}" >> "$GITHUB_OUTPUT"
          echo "hostname=${{ vars.DEPLOY_HOSTNAME }}" >> "$GITHUB_OUTPUT"
          echo "hash=${{ needs.config.outputs.base-tag }}" >> "$GITHUB_OUTPUT"
          echo "image-tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Deploy to cluster
        uses: kitconcept/docker-stack-deploy@v1.4.0
        with:
          registry: "ghcr.io"
          username: ${{ github.actor }}
          password: ${{ secrets.DEPLOY_GHCR_READ_TOKEN }}
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_port: ${{ secrets.DEPLOY_PORT }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_private_key: ${{ secrets.DEPLOY_SSH }}
          stack_file: devops/stacks/persistent.yml
          stack_name: ${{ vars.STACK_NAME }}
          stack_param: ${{ github.ref_name }}
          deploy_timeout: 480
          env_file: |
            STACK_NAME=${{ vars.STACK_NAME }}
            STACK_PREFIX=${{ vars.STACK_PREFIX }}
            STACK_ENV=${{ vars.STACK_ENV }}
            STACK_FRONT_REPLICAS=2
            STACK_BACK_REPLICAS=2
            DEPLOY_HOSTNAME=${{ vars.DEPLOY_HOSTNAME }}
            CERTRESOLVER=${{ vars.CERTRESOLVER }}
            IMAGE_BACKEND=${{ vars.IMAGE_BACKEND }}
            IMAGE_FRONTEND=${{ vars.IMAGE_FRONTEND }}
            IMAGE_TAG=${{ github.ref_name }}
            BASIC_AUTH_USER=${{ vars.BASIC_AUTH_USER }}
            BASIC_AUTH_PASSWORD_HASH=${{ vars.BASIC_AUTH_PASSWORD_HASH }}
            FRONTEND_MIDDLEWARES=${{ vars.FRONTEND_MIDDLEWARES }}
            DB_NAME=${{ vars.DB_NAME }}
            DB_USER=${{ vars.DB_USER }}
            DB_HOST=${{ vars.DB_HOST }}
            DB_PASSWORD=${{ vars.DB_PASSWORD }}
            DB_PORT=${{ vars.DB_PORT }}
            GIT_HASH=${{ needs.config.outputs.base-tag }}

  report:
    name: "Final report"
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - config
      - deploy
    steps:
      - name: Write report
        run: |
          echo '# Workflow Report' >> $GITHUB_STEP_SUMMARY
          echo '## [${{ needs.deploy.outputs.hostname }}](https://${{ needs.deploy.outputs.hostname }})' >> $GITHUB_STEP_SUMMARY
          echo '| Job ID | Conclusion |' >> $GITHUB_STEP_SUMMARY
          echo '| --- | --- |' >> $GITHUB_STEP_SUMMARY
          echo '| config | ${{ needs.config.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| deploy | ${{ needs.deploy.result }} |' >> $GITHUB_STEP_SUMMARY
