name: Frontend CI

on:
  workflow_call:
    inputs:
      base-tag:
        required: true
        type: string
      image-name-prefix:
        required: true
        type: string
      image-name-suffix:
        required: true
        type: string
      node-version:
        required: true
        type: string
      volto-version:
        required: true
        type: string
      storybook-deploy:
        required: false
        type: boolean
        default: true
      working-directory:
        required: false
        type: string
        default: frontend

jobs:
  code-analysis:
    name: "Frontend: Codeanalysis"
    uses: plone/meta/.github/workflows/frontend-code.yml@2.x
    with:
      node-version: ${{ inputs.node-version }}
      working-directory: ${{ inputs.working-directory }}

  i18n:
    name: "Frontend: i18n"
    uses: plone/meta/.github/workflows/frontend-i18n.yml@2.x
    with:
      node-version: ${{ inputs.node-version }}
      working-directory: ${{ inputs.working-directory }}

  unit:
    name: "Frontend: Unit tests"
    uses: plone/meta/.github/workflows/frontend-unit.yml@2.x
    with:
      node-version: ${{ inputs.node-version }}
      working-directory: ${{ inputs.working-directory }}

  # storybook:
  #   name: "Storybook"
  #   uses: plone/meta/.github/workflows/frontend-storybook.yml@2.x
  #   needs:
  #     - code-analysis
  #     - unit
  #     - i18n
  #   with:
  #     node-version: ${{ inputs.node-version }}
  #     working-directory: ${{ inputs.working-directory }}
  #     deploy: ${{ inputs.storybook-deploy }}

  report:
    name: "Final report"
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - code-analysis
      - i18n
      - unit
      # - storybook
    steps:
      - name: Write report
        run: |
          echo '# Workflow Report' >> $GITHUB_STEP_SUMMARY
          echo '| Job ID | Conclusion |' >> $GITHUB_STEP_SUMMARY
          echo '| --- | --- |' >> $GITHUB_STEP_SUMMARY
          echo '| code-analysis | ${{ needs.code-analysis.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| i18n | ${{ needs.i18n.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| unit | ${{ needs.unit.result }} |' >> $GITHUB_STEP_SUMMARY
# echo '| storybook | ${{ needs.storybook.result }} |' >> $GITHUB_STEP_SUMMARY
